plugins { id 'com.android.application' }

android { namespace 'com.feneksxx.glyphcomposite'; compileSdk 35
    defaultConfig { applicationId 'com.feneksxx.glyphcomposite'; minSdk 34; targetSdk 35; versionCode 8; versionName '1.8' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            debuggable false
            minifyEnabled false
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'androidx.core:core:1.15.0'
}
